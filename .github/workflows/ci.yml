name: CI

# Build and test the semantic analyzer on every push and pull request.
# The analyzer consumes the DB25 SQL parser via `find_package(DB25Parser)`,
# so each job must build + install the parser dependency first, then point
# the analyzer at that install prefix with -DCMAKE_PREFIX_PATH.
on:
  push:
  pull_request:

# The parser commit every job in this file builds against, in ONE place.
#
# It used to be three copies of `PARSER_SHA=<sha>`, one per job, with a comment
# in the third asking the reader to keep them in step by hand. Three copies of a
# constant is three chances to bump two of them: a gate built against a
# different parser than the suite it gates would be measuring the wrong thing.
#
# This must match the parser pin the rest of the chain uses - the gitlink at
# db25-logical-plan/external/parser. The umbrella's check_pin_agreement.sh
# compares the two and fails if they drift, because unlike a gitlink this value
# is a string in a YAML file that nothing else would ever notice going stale.
# To bump: set it to the chain's parser pin, not merely to the parser's main.
env:
  PARSER_SHA: 852821ac91202361d1d7ab90f242231d459115c7

jobs:
  # ---------------------------------------------------------------------------
  # Build the parser dependency, then build + test the analyzer.
  # Builds the parser then the analyzer with the supported toolchain (GCC 14).
  # ---------------------------------------------------------------------------
  build-and-test:
    name: build-and-test (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cxx: g++-14
    steps:
      # 1. Check out the analyzer.
      - name: Checkout analyzer
        uses: actions/checkout@v4

      # 2. Install the compiler only if it is missing. ubuntu-24.04 already
      #    ships both g++-13 and g++-14, so the blanket `apt-get update` +
      #    install was a slow, redundant network round-trip on every run.
      - name: Install ${{ matrix.cxx }}
        run: |
          if command -v ${{ matrix.cxx }} >/dev/null 2>&1; then
            echo "${{ matrix.cxx }} already present: $(${{ matrix.cxx }} --version | head -1)"
          else
            sudo apt-get update
            sudo apt-get install -y ${{ matrix.cxx }}
          fi

      # 3. Build + install the parser dependency (portable / non-native build:
      #    ENABLE_NATIVE is intentionally NOT passed so the binaries run on any
      #    runner). Pinned to an exact parser commit (PARSER_SHA, at the top) for
      #    a reproducible contract. The tokenizer is a git submodule and must be
      #    pulled recursively.
      - name: Build and install DB25 SQL parser
        run: |
          # PARSER_SHA comes from the workflow-level env above - one value
          # for every job here. Pinned, so this never floats on the parser's
          # moving main branch.
          git clone https://github.com/space-rf-org/db25-sql-parser
          cd db25-sql-parser
          git checkout "$PARSER_SHA"
          git submodule update --init --recursive
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_TOOLS=OFF \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_INSTALL_PREFIX=$HOME/parser-install
          cmake --build build -j"$(nproc)"
          cmake --install build

      # 4. Configure the analyzer against the parser install, build, and test.
      - name: Configure analyzer
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_PREFIX_PATH=$HOME/parser-install

      - name: Build analyzer
        run: cmake --build build -j"$(nproc)"

      - name: Test analyzer
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Same recipe, but build the analyzer with AddressSanitizer +
  # UndefinedBehaviorSanitizer and run the tests under them. Only the analyzer
  # is sanitized; the parser dependency stays a normal Release install.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitizers (asan+ubsan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v4

      - name: Install g++-14
        # Only install if missing (ubuntu-24.04 already ships g++-14); avoids a
        # redundant apt refresh on every run.
        run: |
          if command -v g++-14 >/dev/null 2>&1; then
            echo "g++-14 already present: $(g++-14 --version | head -1)"
          else
            sudo apt-get update
            sudo apt-get install -y g++-14
          fi

      # Parser install stays a plain Release build (no sanitizers needed).
      - name: Build and install DB25 SQL parser
        run: |
          # PARSER_SHA comes from the workflow-level env above - one value
          # for every job here. Pinned, so this never floats on the parser's
          # moving main branch.
          git clone https://github.com/space-rf-org/db25-sql-parser
          cd db25-sql-parser
          git checkout "$PARSER_SHA"
          git submodule update --init --recursive
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_TOOLS=OFF \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_INSTALL_PREFIX=$HOME/parser-install
          cmake --build build -j"$(nproc)"
          cmake --install build

      # Sanitizer flags apply to the analyzer's own translation units.
      - name: Configure analyzer (asan+ubsan)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_PREFIX_PATH=$HOME/parser-install \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build analyzer (asan+ubsan)
        run: cmake --build build -j"$(nproc)"

      - name: Test analyzer (asan+ubsan)
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  falsifiability:
    name: falsifiability gate (g++-14)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install g++-14
        run: |
          if ! command -v g++-14 >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y g++-14
          fi

      # The analyzer builds against an installed parser, same as every other job
      # in this file.
      # Same pinned-parser recipe the other jobs in this file use, and now
      # literally the same value: PARSER_SHA is defined once at the top.
      - name: Build and install the parser
        run: |
          git clone https://github.com/space-rf-org/db25-sql-parser
          cd db25-sql-parser
          git checkout "$PARSER_SHA"
          git submodule update --init --recursive
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_TOOLS=OFF \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_INSTALL_PREFIX=$HOME/parser-install
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_PREFIX_PATH=$HOME/parser-install

      # A gate that has never been seen to fail is not known to be a gate.
      - name: Self-test (the gate must be able to fail)
        run: python3 tools/falsifiability.py --self-test --build-dir build

      # Every mutant removes one REJECTION. An analyzer earns its keep by
      # refusing bad SQL, so a suite that does not notice a check going silent is
      # a suite that only ever exercises the happy path.
      - name: Falsifiability gate
        run: python3 tools/falsifiability.py --build-dir build

  # ---------------------------------------------------------------------------
  # Line coverage for THIS repository, recomputed every run against a recorded
  # baseline. Each repo measures itself: the same files read very differently
  # from the umbrella's suite, which exercises the query path and builds this
  # repo for its own purposes. A ratchet on one total, not per-file targets.
  #
  # Coverage is what was REACHED, never what was CHECKED - the falsifiability
  # gate above is what decides whether reaching a line means anything.
  # ---------------------------------------------------------------------------
  coverage:
    name: line coverage (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compiler
        run: |
          if command -v g++-14 >/dev/null 2>&1; then
            echo "g++-14 already present: $(g++-14 --version | head -1)"
          else
            sudo apt-get update
            sudo apt-get install -y g++-14
          fi

      # Same pinned-parser recipe every other job in this file uses: this repo
      # consumes the parser through find_package, so coverage needs it installed.
      - name: Build and install the parser
        run: |
          git clone https://github.com/space-rf-org/db25-sql-parser
          cd db25-sql-parser
          git checkout "$PARSER_SHA"
          git submodule update --init --recursive
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_TOOLS=OFF \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_INSTALL_PREFIX=$HOME/parser-install
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Coverage (with the installed parser on the prefix path)
        env:
          # The parser above is built with g++-14; this repo must be built by the
          # SAME toolchain or it links a library from another ABI. Every other job
          # here passes -DCMAKE_CXX_COMPILER explicitly; coverage.sh reads CXX, and
          # derives the matching gcov from it (gcov is version-locked to the
          # compiler that wrote the .gcda).
          CXX: g++-14
        # CMAKE_PREFIX_PATH is set HERE, from $HOME, rather than as a literal in
        # env: - the install step above writes to $HOME/parser-install, and a
        # hardcoded /home/runner/... is an assumption about the runner that is
        # silently wrong the moment it does not hold.
        run: |
          export CMAKE_PREFIX_PATH="$HOME/parser-install"
          test -d "$CMAKE_PREFIX_PATH" || {
            echo "::error::parser install missing at $CMAKE_PREFIX_PATH"; exit 1; }
          # Re-emit the failure as a ::error:: annotation. A failed job whose
          # reason lives only in the log is a job you debug by guessing: the
          # reason belongs where the API and the PR page both show it.
          set -o pipefail
          if ! ./scripts/coverage.sh build-coverage 2>&1 | tee /tmp/coverage.log; then
            echo "::error::coverage failed: $(tail -n 12 /tmp/coverage.log | tr '\n' ' ' | tail -c 700)"
            exit 1
          fi
